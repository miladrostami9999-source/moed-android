name: Build Android APK and AAB
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moed-release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/moed-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          fi
      - run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace -PGOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mento-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 30
      - name: Build signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: gradle assembleRelease bundleRelease --stacktrace -PGOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mento-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_SIGNING == 'true'
        with:
          name: mento-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_SIGNING == 'true'
        with:
          name: mento-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
